services:
  db:
    image: postgres:18-alpine
    container_name: pet2text-fastapi-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pet2text}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pet2text_fastapi}
    ports:
      - "${POSTGRES_PUBLISH:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pet2text} -d ${POSTGRES_DB:-pet2text_fastapi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pet2text_fastapi_pgdata:/var/lib/postgresql
    restart: unless-stopped

  migrate:
    build: .
    image: pet2text-fastapi:local
    container_name: pet2text-fastapi-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pet2text}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-pet2text_fastapi}
      RUN_SEED: ${RUN_SEED:-false}
    command:
      - sh
      - -c
      - |
        set -eu
        alembic upgrade head
        if [ "$${RUN_SEED}" = "true" ]; then python -m scripts.seed; else echo "RUN_SEED != true; skipping seed"; fi

  app:
    image: pet2text-fastapi:local
    container_name: pet2text-fastapi-app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pet2text}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-pet2text_fastapi}
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "${APP_PUBLISH:-127.0.0.1:8000}:8000"
    stop_grace_period: 35s
    restart: unless-stopped

volumes:
  pet2text_fastapi_pgdata:
