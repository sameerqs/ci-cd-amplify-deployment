name: QA - Deploy App to Amplify 

on:
  push:
    branches:
      - qa
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-amplify.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: amplify-qa-deployment
  cancel-in-progress: true

env:
  # Repo-level, non-secret config shared across workflows: Settings ->
  # Secrets and variables -> Actions -> Variables tab.
  AWS_REGION: ${{ vars.AWS_REGION }}
  AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
  IAM_ROLE_ARN: ${{ vars.AMPLIFY_DEPLOY_ROLE_ARN }}

jobs:
  validate-and-deploy:
    name: Validate and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start Amplify deployment
        run: |
          aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name qa \
            --job-type RELEASE