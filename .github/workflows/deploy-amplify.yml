name: QA - Deploy App to Amplify 

on:
  push:
    branches:
      - qa

permissions:
  id-token: write
  contents: read

concurrency:
  group: amplify-qa-deployment
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::692533266280:role/github-actions-amplify-deployment
          aws-region: ap-southeast-1

      - name: Start Amplify deployment
        run: |
          aws amplify start-job \
            --app-id diwsxso3183a1 \
            --branch-name qa \
            --job-type RELEASE