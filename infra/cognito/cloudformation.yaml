AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Pet2text Cognito User Pool with TOTP + production-ready SMS MFA hooks.
  Recovery is email-only so SMS is not used as both MFA and account recovery.

Parameters:
  EnvironmentName:
    Type: String
    Default: pet2text
    Description: Prefix for pool, clients, and SMS IAM role names.
  CallbackURL:
    Type: String
    Default: http://localhost:3000
    Description: Hosted UI / OAuth callback (public client).
  LogoutURL:
    Type: String
    Default: http://localhost:3000/login
  SmsExternalId:
    Type: String
    Default: pet2text-cognito-sms
    NoEcho: true
    Description: sts:ExternalId Cognito presents when assuming the SMS role.
  FromEmail:
    Type: String
    Default: no-reply@example.com
    Description: Cognito email sender (verify in SES for production).
  ReplyToEmail:
    Type: String
    Default: support@example.com
  MfaConfiguration:
    Type: String
    Default: OPTIONAL
    AllowedValues: [OFF, OPTIONAL, ON]
    Description: ON forces MFA after first sign-in (MFA_SETUP / SMS / TOTP).
  EnableSmsMfa:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

Conditions:
  SmsMfaEnabled: !Equals [!Ref EnableSmsMfa, "true"]

Resources:
  CognitoSmsRole:
    Type: AWS::IAM::Role
    Condition: SmsMfaEnabled
    Properties:
      RoleName: !Sub "${EnvironmentName}-cognito-sms"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cognito-idp.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref SmsExternalId
      Policies:
        - PolicyName: sns-publish-sms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PublishTransactionalSms
                Effect: Allow
                Action:
                  - sns:Publish
                Resource: "*"
                Condition:
                  StringEquals:
                    sns:Protocol: sms

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${EnvironmentName}-users"
      DeletionProtection: ACTIVE
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      MfaConfiguration: !Ref MfaConfiguration
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
        - !If [SmsMfaEnabled, SMS_MFA, !Ref AWS::NoValue]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      SmsConfiguration: !If
        - SmsMfaEnabled
        - SnsCallerArn: !GetAtt CognitoSmsRole.Arn
          ExternalId: !Ref SmsExternalId
          SnsRegion: !Ref AWS::Region
        - !Ref AWS::NoValue
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
        From: !Ref FromEmail
        ReplyToEmailAddress: !Ref ReplyToEmail
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: phone_number
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: given_name
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: family_name
          AttributeDataType: String
          Mutable: true
          Required: false
      UserPoolTags:
        Project: !Ref EnvironmentName
        Purpose: cognito-mfa

  PublicAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${EnvironmentName}-web-public"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Ref CallbackURL
      LogoutURLs:
        - !Ref LogoutURL
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  BackendAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${EnvironmentName}-api-confidential"
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${EnvironmentName}-${AWS::AccountId}-${AWS::Region}"
      UserPoolId: !Ref UserPool

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
  Issuer:
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
  JwksUrl:
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
  PublicClientId:
    Description: Next.js public app client (no secret)
    Value: !Ref PublicAppClient
  BackendClientId:
    Description: FastAPI / NestJS confidential client
    Value: !Ref BackendAppClient
  HostedUiDomain:
    Value: !Sub "https://${EnvironmentName}-${AWS::AccountId}-${AWS::Region}.auth.${AWS::Region}.amazoncognito.com"
  SmsRoleArn:
    Condition: SmsMfaEnabled
    Value: !GetAtt CognitoSmsRole.Arn
